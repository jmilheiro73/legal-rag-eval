# Qdrant for the corpus index. Bound to localhost only; data in a named volume.
# Start: docker compose up -d    Stop: docker compose down    (add -v to delete the index)
services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
